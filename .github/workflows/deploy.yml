name: Build and deploy

# Push-to-deploy via a self-hosted runner registered to this repo only, on
# the mini PC itself. See docs/deploy-docker-cicd.md for the full setup and
# why this replaced an earlier webhook/Watchtower design.
#
# IMPORTANT: this trigger must never include `pull_request` (or anything
# else an outside contributor could cause to run). A self-hosted runner
# executes whatever a triggered workflow tells it to, directly on real
# infra - safe here only because this repo is private with no outside
# collaborators and the only trigger is a push straight to `master`, which
# requires push access to this repo. Widening the trigger without also
# reconsidering that is how a self-hosted runner stops being safe.
on:
  push:
    branches: [master]
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull latest and rebuild
        # No actions/checkout - the runner operates directly on the
        # persistent real checkout at C:\source\trivia-survival, which is
        # also the exact path C:\hosting\docker-compose.yml's `build:`
        # context already points at.
        shell: pwsh
        run: |
          Set-Location C:\source\trivia-survival
          git pull

      - name: Rebuild and restart the app container
        # Only `triviasurvival` declares a `build:` in the compose file, so
        # this never touches `cloudflared` - naming it explicitly anyway
        # for clarity, not because it's strictly required.
        shell: pwsh
        run: |
          docker compose -f C:\hosting\docker-compose.yml up -d --build triviasurvival
