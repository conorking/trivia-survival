<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trivia Survival</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container center">
  <h1>🐾 TRIVIA SURVIVAL</h1>
  <p class="muted">Answer fast. Cage up. Survive the dogs.</p>

  <div class="card menu-buttons">
    <button class="primary" onclick="location.href='host.html'">HOST A GAME</button>
    <hr style="border-color:#0f0f1e; width:100%;">
    <label for="joinCode" style="text-align:left;">Have a code?</label>
    <input id="joinCode" type="text" maxlength="5" placeholder="ENTER CODE" style="text-align:center; text-transform:uppercase; letter-spacing:4px;">
    <button onclick="joinWithCode()">JOIN GAME</button>
    <button id="rejoinLastRoom" class="ghost-btn" style="display:none;" onclick="rejoinLastRoom()">REJOIN LAST ROOM</button>
  </div>
</div>
<script>
  const params = new URLSearchParams(location.search);
  const prefill = params.get('code');
  if (prefill) document.getElementById('joinCode').value = prefill.toUpperCase();

  function joinWithCode() {
    const code = document.getElementById('joinCode').value.trim().toUpperCase();
    if (!code) return;
    location.href = `player.html?code=${code}`;
  }
  const lastRoom = Object.keys(localStorage).find(key => key.startsWith('trivia_token_'));
  if (lastRoom) document.getElementById('rejoinLastRoom').style.display = 'block';
  function rejoinLastRoom() {
    const code = lastRoom.slice('trivia_token_'.length);
    location.href = `player.html?code=${code}`;
  }
  document.getElementById('joinCode').addEventListener('keydown', e => {
    if (e.key === 'Enter') joinWithCode();
  });
</script>
</body>
</html>
