<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Host - Trivia Survival</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
  <h1 class="center">🎮 HOST CONSOLE</h1>

  <!-- LOBBY VIEW -->
  <div id="lobbyView">
    <div class="card center" id="roomInfoCard" style="display:none;">
      <h2>Room Code</h2>
      <div class="join-info">
        <div class="join-code" id="roomCode">-----</div>
        <button class="copy-icon-btn" title="Copy code" onclick="copyCode()">📋</button>
        <div id="qrcode-box"></div>
      </div>
      <div class="link-row">
        <input id="joinUrl" type="text" readonly>
        <button onclick="copyLink()">COPY LINK</button>
      </div>
    </div>

    <div class="card">
      <h2>Game Config</h2>
      <p class="muted">Settings apply when you hit START GAME below - no separate save step.</p>
      <div class="row">
        <div>
          <label>Total game duration (seconds)</label>
          <div class="slider-row">
            <input type="range" id="cfgDurationRange" min="30" max="3600" step="10" value="600">
            <input type="number" id="cfgDuration" value="600" min="30" max="3600">
          </div>
        </div>
        <div>
          <label>Answer time per question (seconds)</label>
          <div class="slider-row">
            <input type="range" id="cfgAnswerTimeRange" min="3" max="120" step="1" value="15">
            <input type="number" id="cfgAnswerTime" value="15" min="3" max="120">
          </div>
        </div>
        <div>
          <label>Number of questions</label>
          <div class="slider-row">
            <input type="range" id="cfgQuestionCountRange" min="1" max="100" step="1" value="10">
            <input type="number" id="cfgQuestionCount" value="10" min="1" max="100">
          </div>
        </div>
      </div>
      <label>Question Set</label>
      <select id="cfgQuestionSet">
        <option value="default">Built-in Default Set</option>
        <option value="custom">Custom Upload</option>
      </select>
      <div id="uploadRow" style="display:none; margin-top:10px;">
        <label>Upload questions (.json)</label>
        <input type="file" id="questionFile" accept="application/json">
        <p class="muted" id="uploadStatus">Format: [{ "q": "...", "options": {"A":"..","B":"..","C":".."}, "correct": "A" }, ...]</p>
      </div>
      <label class="checkbox-row">
        <input type="checkbox" id="cfgBearTraps">
        <span>🪤 Bear traps during the escape phase (root anyone who steps on one)</span>
      </label>
      <label class="checkbox-row">
        <input type="checkbox" id="cfgDogLunge">
        <span>🐕‍🦺 Dogs randomly lunge for a burst of speed while hunting</span>
      </label>
      <label class="checkbox-row">
        <input type="checkbox" id="cfgDynamicCellScaling">
        <span>📉 Dynamic cell scaling - cages shrink round by round</span>
      </label>
      <div class="error-msg" id="cfgError"></div>
    </div>

    <div class="card">
      <h2>Players (<span id="playerCount">0</span>)</h2>
      <div class="player-list" id="playerList"></div>
      <button class="primary" style="margin-top:16px;" id="startBtn" onclick="startGame()" disabled>START GAME</button>
      <div class="error-msg" id="startError"></div>
    </div>
  </div>

  <!-- GAME VIEW -->
  <div id="gameView" style="display:none;">
    <div class="status-strip">
      <div class="code-badge">
        <span class="code-val" id="gameCodeVal">-----</span>
        <button class="copy-btn" onclick="copyCode()">Copy</button>
      </div>
      <span class="badge alive">Alive: <span id="aliveCount">0</span></span>
      <span class="badge ghost">Ghosts: <span id="ghostCount">0</span></span>
      <button class="danger" onclick="endGameEarly()">END GAME</button>
    </div>
    <div class="q-indicator">
      <div class="q-big">Q <span id="qIndex">1</span><span class="q-sep">/</span><span id="qTotal">10</span></div>
    </div>
    <div class="question-banner">
      <h3 id="questionText">Waiting for question...</h3>
      <div class="options-row" id="optionsRow"></div>
      <div class="phase-label" id="phaseLabel"></div>
      <div class="timer-bar-wrap"><div class="timer-bar" id="timerBar"></div></div>
    </div>
    <canvas id="arena"></canvas>
  </div>

  <!-- END VIEW (overlay - drawn on top of the game view's last frame, not a replacement for it) -->
  <div id="endView" class="end-overlay" style="display:none;">
    <div class="card center">
      <h2>🏆 GAME OVER</h2>
      <p class="muted" id="endReason"></p>
      <div class="winners-list" id="winnersList"></div>
      <div class="row" style="max-width:420px; margin:16px auto 0;">
        <button class="primary" onclick="rematch()">REMATCH</button>
        <button class="ghost-btn" onclick="newRoom()">NEW ROOM</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="js/arena-render.js"></script>
<script src="js/host.js"></script>
</body>
</html>
