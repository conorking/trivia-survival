# Reference copy of C:\hosting\docker-compose.yml on the mini PC (see
# docs/deploy-docker-cicd.md) — kept here purely as documentation of the
# real deploy topology, same as deploy/Caddyfile and
# deploy/trivia-survival.service already do for the Oracle deploy path.
# There's nothing to actually apply from this file: it matches what's
# already running.
#
# `triviasurvival` builds locally from this repo's checkout
# (C:/source/trivia-survival) rather than pulling a pre-built image - the
# self-hosted runner (.github/workflows/deploy.yml) does a `git pull` in
# that same checkout on every push to master, then `docker compose up -d
# --build`, so this is just the same manual update recipe, automated.
# `cloudflared` is unrelated to CI/CD - it's the tunnel that's already
# routing traffic here, included for completeness of the real topology.
# Both share `hosting_net` so cloudflared can reach the app by service name.

services:
  triviasurvival:
    build: C:/source/trivia-survival
    restart: unless-stopped
    networks: [hosting_net]
    # no "ports:" — reachable only from inside hosting_net

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared:/etc/cloudflared
    networks: [hosting_net]

networks:
  hosting_net:
    driver: bridge
